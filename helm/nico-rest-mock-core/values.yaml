replicaCount: 1

nameOverride: ""
fullnameOverride: nico-rest-mock-core

image:
  repository: nico-core-mock
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Optional extras merged into chart defaults. Chart always forces root + privileged
# so virt-customize user-data injection works without extra values.
podSecurityContext: {}

# Optional extras; chart defaults (privileged, writable rootfs) always win.
securityContext: {}

service:
  type: ClusterIP
  port: 11079

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

logLevel: debug

extraEnv: []
extraVolumeMounts: []
extraVolumes: []

libvirt:
  enabled: false
  # libvirt URI, e.g. qemu+tcp://192.168.122.1:16509/system or qemu+ssh://root@host/system
  # When enabled, instance user-data is injected into the root disk via virt-customize
  # automatically (no separate helm flag).
  endpoint: ""
  storagePool: default
  # Default root volume size when the OS image does not specify capacity.
  volumeGiB: 20

# Persist VPCs, instances, and other runtime Forge state across pod restarts.
persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""
  mountPath: /data
  stateFile: /data/forge-state.json
  imageCacheDir: /data/os-image-cache
  tempDir: /data/tmp
